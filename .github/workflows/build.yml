name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Release signing secrets are optional: if they are not configured yet
      # (e.g. before the repo owner adds them), assembleRelease still works
      # by falling back to the debug keystore — see app/build.gradle.kts.
      - name: Decode release keystore
        env:
          GUNSTAIRS_KEYSTORE_BASE64: ${{ secrets.GUNSTAIRS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GUNSTAIRS_KEYSTORE_BASE64" ]; then
            echo "$GUNSTAIRS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GUNSTAIRS_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build, test, lint
        env:
          GUNSTAIRS_KEYSTORE_PASSWORD: ${{ secrets.GUNSTAIRS_KEYSTORE_PASSWORD }}
          GUNSTAIRS_KEY_ALIAS: ${{ secrets.GUNSTAIRS_KEY_ALIAS }}
          GUNSTAIRS_KEY_PASSWORD: ${{ secrets.GUNSTAIRS_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease test lint --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
